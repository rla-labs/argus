# == ARGUS AGENT PROJECT ==
# One project.
#
# Copy to /data/config/projects/<id>.yaml. The FILE NAME must match `id`, and the id
# must be a slug: lowercase letters, digits and hyphens, at least two characters.
#
# A project is a top-level dsh agent with its own working directory, model, budget
# and memory. It is the unit that does work.

id: example

# The working directory. It MUST be inside <data_dir>/projects/ — the loader refuses
# a path outside it, because that boundary is what keeps one project out of another's
# files.
cwd: /data/projects/example

# One line, and it matters more than it looks: this is the ONLY thing the orchestrator
# knows about what a project is for. "example" tells a model nothing; "the customer
# site's build and deploy" tells it when to route here.
description: An example project — replace this with what the project is FOR.

provider: deepseek
model: deepseek-v4-pro

# Used at the soft budget threshold when `soft_action: downgrade`. A cheaper model
# doing a degraded job beats a stopped project.
fallback_model: deepseek/deepseek-flash

# The dsh agent preset mounted into this project's scope. Leave null for the default;
# a restricted preset is how a project gets a smaller tool surface.
preset: null

# ── limits ──────────────────────────────────────────────────────────────────────
#
# Per-run ceilings, overriding the deployment's.

limits:
  max_steps_per_run: 60
  max_wallclock_min: 45
  max_tokens_per_request: 8000
  max_subagent_depth: 1
  loop_repeat_threshold: 5

# ── budget ──────────────────────────────────────────────────────────────────────

budget:
  day_usd: 3
  month_usd: 40
  # Where the report starts mentioning this project.
  info_pct: 50
  # Where the soft action fires.
  soft_pct: 80
  # `warn` reports; `downgrade` switches to `fallback_model`.
  soft_action: warn
  # `pause` stops the project and keeps a human's message queued; `reject_new`
  # refuses new work and lets the current run finish.
  hard_action: pause

# ── approvals ───────────────────────────────────────────────────────────────────
#
# `ask`   every risky action becomes a Telegram question
# `deny`  refused WITHOUT asking, deterministically
# `auto`  the allowlist runs unattended; everything else asks

approvals:
  mode: ask
  # Each entry is a COMMAND LINE, matched on parsed argv tokens:
  #
  #   - git status        matches `git status` and `git status --short`
  #   - npm test          matches `npm test` and `npm test -- --watch`
  #
  # It does NOT match `git push`, `git status; rm -rf /`, or `git status && rm -rf /`
  # — a compound command is refused however neatly its prefix matches.
  #
  # Write the rule as you would type the command, and extend it with a flag rather
  # than relying on a prefix:
  auto_allow: []
  # - git status
  # - git diff
  # - npm test

  # How long the question waits. After it, the answer is NO. Silence is the likeliest
  # outcome for an operator who is asleep.
  timeout_minutes: 30

# ── tools ───────────────────────────────────────────────────────────────────────
#
# What the agent may use, by group:
#   off    the agent does not see the tools at all
#   deny   refused, without asking
#   ask    a Telegram question each time (shell still honours approvals.auto_allow)
#   allow  runs unasked
# A read or write OUTSIDE this project's folder asks even under `allow`.
# Change one from the chat: /set <project> tools.web allow. See it: /tools <project>.

tools:
  read: allow       # read, read_image, glob, grep
  write: ask        # write, edit
  shell: ask        # bash, pwsh, run_code
  web: ask          # web_fetch, web_search
  agents: off       # subagent, workflow, ralph, send_message, ...: delegating to other agents
  other: ask        # any tool not listed (a newer dsh's, an integration's); never off
  # Sites web_fetch reaches without asking under `web: ask`. A host covers its subdomains.
  web_hosts: []
  #   - news.ycombinator.com
  # One tool's access over its group's: /set <project> tools.exceptions.<tool> <value>
  exceptions: {}
  #   web_search: allow
  #   edit: deny

# ── MCP servers ─────────────────────────────────────────────────────────────────
# Tools from other systems, as mcp__<server>__<tool>. A local program (command) or a
# remote server (url). Never write a secret here: write ${NAME} and send
# /key NAME <value> in the chat. After adding one, /reset <project>.
# access: deny | ask (default) | allow, for every tool of the server.

mcp: {}
#  github:
#    command: npx
#    args: ["-y", "@modelcontextprotocol/server-github"]
#    env:
#      GITHUB_PERSONAL_ACCESS_TOKEN: "${GITHUB_TOKEN}"
#    access: ask
#  docs:
#    url: https://mcp.example.com/mcp
#    headers:
#      Authorization: "Bearer ${DOCS_TOKEN}"

# ── memory ──────────────────────────────────────────────────────────────────────

memory:
  # Whether this project receives the global USER.md. A project may opt OUT of the
  # profile; it can never opt INTO another project's memory.
  user_profile: true

# Whether each run's progress is reported to the chat, as one edited message.
progress: true
