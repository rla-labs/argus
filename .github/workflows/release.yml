# == ARGUS AGENT PROJECT ==
# A version tag (v0.1.0, v0.2.0, …) publishes the Docker image to
# ghcr.io/rla-labs/argus, tagged with the version and `latest` — the image
# deploy/scripts/install.sh pulls by default — and then the GitHub Release, with notes
# generated from the commits since the previous tag (CHANGELOG.md is not in the repo).
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          build-args: ARGUS_AGENT_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/rla-labs/argus:${{ steps.version.outputs.version }}
            ghcr.io/rla-labs/argus:latest
          labels: org.opencontainers.image.version=${{ steps.version.outputs.version }}

      # After the image, so a release never points at an image that failed to publish.
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes \
            --title "Argus Agent ${{ steps.version.outputs.version }}" \
            --notes "Docker image: \`ghcr.io/rla-labs/argus:${{ steps.version.outputs.version }}\`"
