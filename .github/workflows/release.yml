# == ARGUS AGENT PROJECT ==
# A version tag (v0.1.0, v0.2.0, …) publishes the Docker image to
# ghcr.io/rla-labs/argus-agent, tagged with the version and `latest` — the image
# deploy/scripts/install.sh pulls by default.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          build-args: ARGUS_AGENT_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/rla-labs/argus-agent:${{ steps.version.outputs.version }}
            ghcr.io/rla-labs/argus-agent:latest
          labels: org.opencontainers.image.version=${{ steps.version.outputs.version }}
